<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    <form id="login-form">
        <label for="login-email-input">E-mail:</label>
        <input
            id="login-email-input"
            name="email"
            type="email"
            placeholder="email@email.com"
            required
        ><br/>

        <label for="login-password-input">Senha:</label>
        <input
            id="login-password-input"
            name="password"
            type="password"
            placeholder="Sua senha"
            required
        ><br/>

        <button type="submit">Login</button>
    </form><br/>


    Ainda não tem cadastro?<br>
    <a href="./register.html">Cadastre-se aqui!</a>

    <script src="./js/login.js"></script>

</body>
</html>
