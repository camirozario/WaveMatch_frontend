<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>WaveMatch | Meu Perfil</title>
</head>

<body>

    <h1>Meu perfil</h1>

    <form id="profile-form">

        <h2 id="profile-name"></h2>

        <p id="profile-email"></p>

        <p id="profile-dob"></p>
      

        <label for="profile-surf-level">Nível de Surf:</label>
        <select id="profile-surf-level">
            <option value="iniciante">Iniciante</option>
            <option value="intermediario">Intermediário</option>
            <option value="avancado">Avançado</option>
        </select>
        <br>

        <label for="profile-min-wave">Altura mínima de onda (m):</label>
        <input
            id="profile-min-wave"
            type="number"
            step="0.1"
            min="0"
        >
        <br>

        <label for="profile-max-wave">Altura máxima de onda (m):</label>
        <input
            id="profile-max-wave"
            type="number"
            step="0.1"
            min="0"
        >
        <br>

        <button type="submit">Salvar alterações</button>

    </form>

    <button id="delete-account-button" type="button">
        Excluir minha conta
    </button>

    <script src="./js/profile.js"></script>

</body>
</html>
